services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: ${DOCKERHUB_NAMESPACE:-afifalhauzan123}/umkm-website-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-umkm_website}
      DB_USERNAME: ${DB_USERNAME:-umkm}
      DB_PASSWORD: ${DB_PASSWORD:-umkm_password}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
      RUN_MIGRATIONS: "true"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/storage
    healthcheck:
      test: ["CMD-SHELL", "php -v >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: ${DOCKERHUB_NAMESPACE:-afifalhauzan123}/umkm-website-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - storage_data:/var/www/storage:ro

  mysql:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-umkm_website}
      MARIADB_USER: ${DB_USERNAME:-umkm}
      MARIADB_PASSWORD: ${DB_PASSWORD:-umkm_password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password_change_me}
    ports:
      - "${DB_PORT_EXPOSE:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
  storage_data:
